name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Bundle ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
          - label: Linux (x64)
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows (x64)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/core -> target
            src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CivicFlow ${{ github.ref_name }}
          releaseBody: |
            CivicFlow desktop installers for macOS, Windows and Linux.

            The demo accounts are `praket@feedmorewny.org` (coordinator) and
            `maya.chen@gmail.com` (volunteer), both with the password
            `civicflow-demo`. Change the coordinator password from Settings →
            Accounts before entering real volunteer data.

            These builds are not code-signed. macOS and Windows will warn about
            an unidentified developer; verify the SHA-256 checksum published
            with each asset if the download matters to you.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  checksums:
    name: Publish checksums
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download every installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir artifacts --clobber

      - name: Write SHA-256 checksums
        working-directory: artifacts
        run: |
          rm -f SHA256SUMS.txt
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
