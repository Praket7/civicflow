[package]
name = "civicflow-core"
version = "0.1.1"
edition = "2021"
rust-version = "1.77"
description = "CivicFlow domain rules, SQLite persistence, and read models"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
